name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ufbt
        run: pip install ufbt

      - name: Fetch Momentum SDK
        run: ufbt update --index-url=https://up.momentum-fw.dev/firmware/directory.json

      - name: Build .fap
        run: ufbt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ir_trainer-fap
          path: dist/*.fap
          if-no-files-found: error
